<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Legs -->
  <rect x="9.2" y="17" width="2.2" height="4" fill="currentColor"/>
  <rect x="12.6" y="17" width="2.2" height="4" fill="currentColor"/>

  <!-- Antennae -->
  <path d="M8.5 6C7.5 4.5 5.8 4.5 5.8 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M15.5 6C16.5 4.5 18.2 4.5 18.2 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Main Round Body -->
  <circle cx="12" cy="12" r="7.5" fill="currentColor"/>

  <!-- Claws / Hands with white separator -->
  <circle cx="4.8" cy="12" r="2.4" fill="currentColor" stroke="#ffffff" stroke-width="0.9"/>
  <circle cx="19.2" cy="12" r="2.4" fill="currentColor" stroke="#ffffff" stroke-width="0.9"/>

  <!-- Eyes (White background) -->
  <circle cx="9.6" cy="9.5" r="1.35" fill="#ffffff"/>
  <circle cx="14.4" cy="9.5" r="1.35" fill="#ffffff"/>

  <!-- Pupils (Looking slightly up and right) -->
  <circle cx="10" cy="9.2" r="0.55" fill="currentColor"/>
  <circle cx="14.8" cy="9.2" r="0.55" fill="currentColor"/>
</svg>
