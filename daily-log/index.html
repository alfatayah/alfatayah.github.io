<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --color-black: #111111;
        --color-gray: #555555;
        --color-gray-light: #888888;
        --color-border: #e5e5e5;
        --color-bg: #ffffff;
        --color-bg-alt: #fafafa;
        --font-main: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { overflow-x: hidden; }
      body {
        background-color: var(--color-bg);
        color: var(--color-black);
        font-family: var(--font-main);
        font-size: 16px;
        line-height: 1.6;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      a { color: inherit; }

      /* Navbar: same look as the portfolio navbar */
      .navbar-container {
        position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--color-border);
      }
      .navbar-wrapper {
        max-width: 1100px; margin: 0 auto; padding: 18px 40px;
        display: flex; align-items: center; justify-content: space-between;
      }
      .nav-logo {
        font-size: 1.25rem; font-weight: 700; color: var(--color-black);
        text-decoration: none; letter-spacing: -0.02em;
      }
      .links-wrapper { display: flex; align-items: center; gap: 4px; }
      .links-wrapper a {
        color: var(--color-gray); font-size: 0.9375rem; font-weight: 500;
        padding: 8px 14px; border-radius: 6px; text-decoration: none;
        transition: color 0.2s ease;
      }
      .links-wrapper a:hover, .links-wrapper a[aria-current="page"] { color: var(--color-black); }

      /* Page */
      .container { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 40px; }
      main { padding: 120px 0 72px; min-height: 70vh; }
      .section-heading {
        font-size: 2.5rem; font-weight: 700; text-decoration: underline;
        text-underline-offset: 6px; text-align: center; margin-bottom: 12px;
        letter-spacing: -0.01em;
      }
      .section-subheading { font-size: 0.9375rem; color: var(--color-gray); text-align: center; margin-bottom: 40px; }
      .back-link { display: inline-block; margin-bottom: 28px; font-size: 0.9375rem; font-weight: 500; color: var(--color-gray); text-decoration: none; }
      .back-link:hover { color: var(--color-black); }

      /* List */
      .dl-list { list-style: none; }
      .dl-item { padding: 24px 0; border-top: 1px solid var(--color-border); }
      .dl-item:last-child { border-bottom: 1px solid var(--color-border); }
      .dl-date { font-size: 0.875rem; font-weight: 600; color: var(--color-gray-light); margin-bottom: 4px; }
      .dl-item-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
      .dl-item-title a { text-decoration: none; }
      .dl-item-title a:hover { text-decoration: underline; text-underline-offset: 4px; }
      .dl-excerpt { font-size: 0.9375rem; color: var(--color-gray); }
      .dl-message { text-align: center; color: var(--color-gray); padding: 32px 0; }
      .dl-message-error { color: var(--color-black); }

      /* Post */
      .dl-post-title { font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; margin-bottom: 28px; }
      .dl-body { font-size: 1.0625rem; color: var(--color-gray); overflow-wrap: anywhere; }
      .dl-body > * + * { margin-top: 1em; }
      .dl-body h1, .dl-body h2, .dl-body h3, .dl-body h4, .dl-body h5, .dl-body h6 { color: var(--color-black); line-height: 1.3; margin-top: 1.6em; }
      .dl-body ul, .dl-body ol { padding-left: 1.5em; }
      .dl-body li + li { margin-top: 0.35em; }
      .dl-body a { color: var(--color-black); text-underline-offset: 3px; }
      .dl-body img { max-width: 100%; height: auto; border-radius: 6px; }
      .dl-body blockquote { border-left: 3px solid var(--color-border); padding-left: 16px; }
      .dl-body pre { background: var(--color-bg-alt); border: 1px solid var(--color-border); border-radius: 6px; padding: 12px 16px; overflow-x: auto; }
      .dl-body code { font-size: 0.9em; }
      /* Quill alignment and indent classes kept by Forme's sanitizer */
      .dl-body .ql-align-center { text-align: center; }
      .dl-body .ql-align-right { text-align: right; }
      .dl-body .ql-align-justify { text-align: justify; }
      .dl-body .ql-indent-1:not(li) { padding-left: 3em; }
      .dl-body li.ql-indent-1 { margin-left: 3em; }
      .dl-body .ql-indent-2:not(li) { padding-left: 6em; }
      .dl-body li.ql-indent-2 { margin-left: 6em; }
      .dl-body .ql-indent-3:not(li) { padding-left: 9em; }
      .dl-body li.ql-indent-3 { margin-left: 9em; }
      .dl-body .ql-indent-4:not(li) { padding-left: 12em; }
      .dl-body li.ql-indent-4 { margin-left: 12em; }
      .dl-body .ql-indent-5:not(li) { padding-left: 15em; }
      .dl-body li.ql-indent-5 { margin-left: 15em; }
      .dl-body .ql-indent-6:not(li) { padding-left: 18em; }
      .dl-body li.ql-indent-6 { margin-left: 18em; }
      .dl-body .ql-indent-7:not(li) { padding-left: 21em; }
      .dl-body li.ql-indent-7 { margin-left: 21em; }
      .dl-body .ql-indent-8:not(li) { padding-left: 24em; }
      .dl-body li.ql-indent-8 { margin-left: 24em; }

      @media (max-width: 767px) {
        .navbar-wrapper { padding: 16px 20px; }
        .container { padding: 0 20px; }
        main { padding: 96px 0 48px; }
        .section-heading { font-size: 1.875rem; }
        .dl-post-title { font-size: 1.625rem; }
      }
    </style>
  </head>
  <body>
    <nav class="navbar-container">
      <div class="navbar-wrapper">
        <a class="nav-logo" href="/">Fadhil<span class="dot">.</span></a>
        <div class="links-wrapper">
          <a href="/">Home</a>
          <a href="/daily-log/" aria-current="page">Daily Log</a>
        </div>
      </div>
    </nav>
    <main>
      <div class="container">
        <h1 class="section-heading">Daily Log</h1>
        <p class="section-subheading">Short notes from my day to day work.</p>
        <div id="daily-log-app" data-page="index" aria-live="polite">
          <p class="dl-message">Loading...</p>
          <noscript><p class="dl-message">Please enable JavaScript to read the daily log.</p></noscript>
        </div>
      </div>
    </main>
    <script src="daily-log.js"></script>
  </body>
</html>
